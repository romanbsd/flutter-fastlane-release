name: Check shared release lanes

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
      - run: bundle exec ruby test/release_check.rb
      - run: bundle exec ruby test/app_store_tools_check.rb
